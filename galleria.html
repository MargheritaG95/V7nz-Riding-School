    html, body { margin: 0; padding: 0; }

    /* ===== NAVBAR identica alla index ===== */
    .pill-nav {
      display: flex;
      justify-content: center;
      background-color: #222;
      padding: 15px;            /* identico alla index */
      flex-wrap: wrap;          /* 2 righe su mobile */
      gap: 10px;                /* spazio uniforme */
      z-index: 2;
      position: relative;
      margin: 0;
    }
    .pill-nav a,
    .pill-nav .dropbtn {
      color: #fff;
      text-decoration: none;
      padding: 0.7rem 1.2rem;
      border-radius: 25px;
      background-color: #333;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      transition: 0.3s;
      border: 0;
      margin: 0;                /* solo gap gestisce lo spazio */
      font-size: 1rem;
      line-height: 1;
    }
    .pill-nav a:hover,
    .pill-nav a.active,
    .pill-nav .dropbtn:hover {
      background-color: gold;
      color: #111;
    }

    .dropdown { position: relative; }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%; left: 0;
      background-color: #333;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      flex-direction: column;
      z-index: 10;
      min-width: 180px;
      overflow: hidden;
    }
    .dropdown-content a {
      padding: 10px 20px;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      background: #333;
      margin: 0;
    }
    .dropdown-content a:hover { background-color: gold; color: #111; }

    /* Mostra su hover (desktop) */
    @media (hover: hover) and (pointer: fine) {
      .dropdown:hover .dropdown-content { display: flex; }
    }
    /* Apertura su mobile via classe .open (gestita da JS) */
    .dropdown.open .dropdown-content { display: flex; }

    /* Leggera compattazione su schermi molto piccoli (come index) */
    @media (max-width: 480px){
      .pill-nav a, .pill-nav .dropbtn { padding: 0.6rem 1rem; font-size: 0.95rem; }
    }

    /* ===== Header ===== */
    header {
      text-align: center;
      padding: 1.5rem 1rem;
      max-width: 900px;
      margin: auto;
    }
    header h1 {
      font-size: 3rem;
      color: gold;
      border-bottom: 4px solid #ffdd00;
      display: inline-block;
      padding-bottom: 0.3rem;
      font-weight: 700;
    }
    header p {
      margin-top: 1rem;
      font-size: 1.25rem;
      color: #eee;
    }

    /* ===== Masonry-style grid ===== */
    .grid-container {
      column-count: 3;
      column-gap: 1rem;
      max-width: 1200px;
      margin: auto;
      padding: 1rem;
    }
    @media (max-width: 900px) { .grid-container { column-count: 2; } }
    @media (max-width: 600px) { .grid-container { column-count: 1; } }

    .grid-item { margin-bottom: 1rem; break-inside: avoid; }
    .grid-item img {
      width: 100%;
      border-radius: 12px;
      border: 3px solid #ffdd00;
      box-shadow: 0 0 10px #ffdd0044;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    .grid-item img:hover { transform: scale(1.02); box-shadow: 0 0 25px #ffdd00cc; }

    /* ===== Lightbox ===== */
    .lightbox-modal {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .lightbox-modal.active { display: flex; }
    .lightbox-modal img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 10px;
      box-shadow: 0 0 50px #ffdd00cc;
    }
    .lightbox-modal .close-btn {
      position: absolute; top: 2rem; right: 2rem;
      font-size: 2.5rem; color: #ffdd00; cursor: pointer; font-weight: 700;
    }
    .lightbox-modal .close-btn:hover { color: #fff; }

    /* ===== Footer ===== */

      text-align: center;
      margin-top: 2rem;
      color: #aaa;
    }
    footer a { color: #aaa; margin-left: .4rem; }

  <script>
    /* Dropdown touch-friendly (mobile) */
    function toggleDropdown(e){
      e.preventDefault();
      const dd = document.getElementById('navDropdown');
      const btn = dd.querySelector('.dropbtn');
      const isOpen = dd.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    }
    // Chiudi il dropdown toccando/cliccando fuori
    document.addEventListener('click', function(ev){
      const dd = document.getElementById('navDropdown');
      if(dd && !dd.contains(ev.target)){
        dd.classList.remove('open');
        const btn = dd.querySelector('.dropbtn');
        btn && btn.setAttribute('aria-expanded','false');
      }
    });

    // Lightbox
    const images = document.querySelectorAll('.grid-item img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.getElementById('lightbox-close');

    images.forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    closeBtn.addEventListener('click', () => {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }
    });
  </script>
